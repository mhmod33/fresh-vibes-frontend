<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="sidebar-header">
      <img src="/assets/logo-white.jpeg" alt="Fresh Vibes" class="sidebar-logo">
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/admin" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
        </span>
        <span>{{ 'admin.dashboard' | translate }}</span>
      </a>
      <a routerLink="/admin/products" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
            <line x1="12" y1="22.08" x2="12" y2="12"></line>
          </svg>
        </span>
        <span>{{ 'admin.products' | translate }}</span>
      </a>
      <a routerLink="/" class="nav-item">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
        </span>
        <span>View Website</span>
      </a>
    </nav>
  </aside>

  <main class="admin-main">
    <header class="admin-header">
      <h1>{{ isEditMode ? ('admin.editProduct' | translate) : ('admin.addProduct' | translate) }}</h1>
      <div class="header-actions">
        <a routerLink="/" class="btn-logout">Logout</a>
      </div>
    </header>

    <div class="form-content">
      @if (errorMessage) {
        <div class="error-message">{{ errorMessage }}</div>
      }

      <form (ngSubmit)="onSubmit()" class="product-form">
        <div class="form-row">
          <div class="form-group">
            <label for="name">Product Name *</label>
            <input
              type="text"
              id="name"
              name="name"
              [(ngModel)]="productForm.name"
              required
              placeholder="Enter product name"
            />
          </div>

          <div class="form-group">
            <label for="category">Category *</label>
            <select
              id="category"
              name="category"
              [(ngModel)]="productForm.category"
              required
            >
              @for (cat of categories; track cat.id) {
                <option [value]="cat.id">{{ cat.name }}</option>
              }
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="price">Price *</label>
            <input
              type="number"
              id="price"
              name="price"
              [(ngModel)]="productForm.price"
              required
              min="0"
              step="0.01"
              placeholder="Enter price"
            />
          </div>

          <div class="form-group">
            <label for="stock">Stock *</label>
            <input
              type="number"
              id="stock"
              name="stock"
              [(ngModel)]="productForm.stock"
              required
              min="0"
              placeholder="Enter stock quantity"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="description">Description *</label>
          <textarea
            id="description"
            name="description"
            [(ngModel)]="productForm.description"
            required
            rows="4"
            placeholder="Enter product description"
          ></textarea>
        </div>

        <div class="form-group">
          <label for="image">Product Image</label>
          <div class="image-upload-section">
            <input
              type="file"
              id="image"
              name="image"
              accept="image/*"
              (change)="onFileSelected($event)"
              class="file-input"
            />
            <label for="image" class="file-label">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="upload-icon">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
              </svg>
              <span>{{ selectedFile ? selectedFile.name : 'Choose image or drag here' }}</span>
              <span class="file-hint">Max 2MB • JPEG, PNG, GIF, WebP</span>
            </label>

            @if (imagePreview) {
              <div class="image-preview-container">
                <img [src]="imagePreview" alt="Preview" class="image-preview" />
                <button type="button" (click)="removeImage()" class="btn-remove-image">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                  </svg>
                  Remove
                </button>
              </div>
            }
          </div>
        </div>

        <div class="form-group">
          <label class="checkbox-label">
            <input
              type="checkbox"
              name="is_active"
              [(ngModel)]="productForm.is_active"
            />
            <span>Product is active</span>
          </label>
        </div>

        <div class="form-actions">
          <button type="button" (click)="onCancel()" class="btn-cancel" [disabled]="isLoading">
            {{ 'admin.cancel' | translate }}
          </button>
          <button type="submit" class="btn-submit" [disabled]="isLoading">
            {{ isLoading ? 'Saving...' : ('admin.save' | translate) }}
          </button>
        </div>
      </form>
    </div>
  </main>
</div>
