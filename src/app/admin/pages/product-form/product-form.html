<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="sidebar-header">
      <img src="/assets/logo-white.jpeg" alt="Fresh Vibes" class="sidebar-logo">
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/admin" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
        </span>
        <span>{{ 'admin.dashboard' | translate }}</span>
      </a>
      <a routerLink="/admin/products" routerLinkActive="active" class="nav-item">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
            <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
            <line x1="12" y1="22.08" x2="12" y2="12"></line>
          </svg>
        </span>
        <span>{{ 'admin.products' | translate }}</span>
      </a>
      <a routerLink="/" class="nav-item">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
        </span>
        <span>View Website</span>
      </a>
    </nav>
  </aside>

  <main class="admin-main">
    <header class="admin-header">
      <h1>{{ isEditMode ? ('admin.editProduct' | translate) : ('admin.addProduct' | translate) }}</h1>
      <div class="header-actions">
        <a routerLink="/" class="btn-logout">Logout</a>
      </div>
    </header>

    <div class="form-content">
      <form (ngSubmit)="onSubmit()" class="product-form">
        <div class="form-row">
          <div class="form-group">
            <label for="name">Product Name *</label>
            <input
              type="text"
              id="name"
              name="name"
              [(ngModel)]="productForm.name"
              required
              placeholder="Enter product name"
            />
          </div>

          <div class="form-group">
            <label for="category">Category *</label>
            <select
              id="category"
              name="category"
              [(ngModel)]="productForm.category"
              required
            >
              @for (cat of categories; track cat.id) {
                <option [value]="cat.id">{{ cat.name }}</option>
              }
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="icon">Icon Type *</label>
            <select
              id="icon"
              name="icon"
              [(ngModel)]="productForm.icon"
              required
            >
              @for (icon of icons; track icon) {
                <option [value]="icon">{{ icon }}</option>
              }
            </select>
          </div>

          <div class="form-group">
            <label for="price">Price</label>
            <input
              type="text"
              id="price"
              name="price"
              [(ngModel)]="productForm.price"
              placeholder="Enter price or 'Contact for pricing'"
            />
          </div>
        </div>

        <div class="form-group">
          <label for="description">Description *</label>
          <textarea
            id="description"
            name="description"
            [(ngModel)]="productForm.description"
            required
            rows="4"
            placeholder="Enter product description"
          ></textarea>
        </div>

        <div class="form-actions">
          <button type="button" (click)="onCancel()" class="btn-cancel">
            {{ 'admin.cancel' | translate }}
          </button>
          <button type="submit" class="btn-submit">
            {{ 'admin.save' | translate }}
          </button>
        </div>
      </form>
    </div>
  </main>
</div>
