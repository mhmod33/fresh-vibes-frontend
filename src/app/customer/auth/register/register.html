<section class="auth-page">
  <div class="auth-decorations">
    <div class="decoration-leaf decoration-leaf-1">
      <svg viewBox="0 0 40 40" fill="none">
        <path d="M20 5C20 5 12 9 12 20C12 26 16 32 20 32C24 32 28 26 28 20C28 9 20 5 20 5Z" stroke="currentColor" stroke-width="1.5"/>
      </svg>
    </div>
    <div class="decoration-leaf decoration-leaf-2">
      <svg viewBox="0 0 40 40" fill="none">
        <path d="M20 5C20 5 12 9 12 20C12 26 16 32 20 32C24 32 28 26 28 20C28 9 20 5 20 5Z" stroke="currentColor" stroke-width="1.5"/>
      </svg>
    </div>
  </div>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">

        <h1>{{ 'auth.register' | translate }}</h1>
        <p>Create your Fresh Vibes account</p>
      </div>

      <form (ngSubmit)="onSubmit()" class="auth-form" #registerFormElement="ngForm">
        <div class="form-group" [class.has-error]="errorMessage && errorField === 'name'">
          <label for="name">
            <svg class="label-icon" viewBox="0 0 24 24" fill="none">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2"/>
            </svg>
            {{ 'auth.name' | translate }}
          </label>
          <input
            type="text"
            id="name"
            name="name"
            [(ngModel)]="registerForm.name"
            required
            maxlength="255"
            placeholder="Your full name"
            [class.error]="errorMessage && errorField === 'name'"
          />
          <span class="error-message" *ngIf="errorMessage && errorField === 'name'">{{ errorMessage }}</span>
        </div>

        <div class="form-group" [class.has-error]="errorMessage && errorField === 'email'">
          <label for="email">
            <svg class="label-icon" viewBox="0 0 24 24" fill="none">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" stroke="currentColor" stroke-width="2"/>
              <polyline points="22,6 12,13 2,6" stroke="currentColor" stroke-width="2"/>
            </svg>
            {{ 'auth.email' | translate }}
          </label>
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="registerForm.email"
            required
            placeholder="your@email.com"
            [class.error]="errorMessage && errorField === 'email'"
          />
          <span class="error-message" *ngIf="errorMessage && errorField === 'email'">{{ errorMessage }}</span>
        </div>

        <div class="form-group" [class.has-error]="errorMessage && errorField === 'password'">
          <label for="password">
            <svg class="label-icon" viewBox="0 0 24 24" fill="none">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke="currentColor" stroke-width="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="currentColor" stroke-width="2"/>
            </svg>
            {{ 'auth.password' | translate }}
          </label>
          <div class="password-input-wrapper">
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              name="password"
              [(ngModel)]="registerForm.password"
              required
              minlength="8"
              placeholder="••••••••"
              [class.error]="errorMessage && errorField === 'password'"
            />
            <button type="button" class="toggle-password" (click)="togglePasswordVisibility()">
              <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" stroke-width="2"/>
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
              </svg>
              <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" stroke="currentColor" stroke-width="2"/>
                <line x1="1" y1="1" x2="23" y2="23" stroke="currentColor" stroke-width="2"/>
              </svg>
            </button>
          </div>
          <span class="error-message" *ngIf="errorMessage && errorField === 'password'">{{ errorMessage }}</span>
        </div>

        <div class="form-group" [class.has-error]="errorMessage && errorField === 'password_confirmation'">
          <label for="confirmPassword">
            <svg class="label-icon" viewBox="0 0 24 24" fill="none">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" stroke="currentColor" stroke-width="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4" stroke="currentColor" stroke-width="2"/>
            </svg>
            {{ 'auth.confirmPassword' | translate }}
          </label>
          <div class="password-input-wrapper">
            <input
              [type]="showConfirmPassword ? 'text' : 'password'"
              id="confirmPassword"
              name="confirmPassword"
              [(ngModel)]="registerForm.password_confirmation"
              required
              minlength="8"
              placeholder="••••••••"
              [class.error]="errorMessage && errorField === 'password_confirmation'"
            />
            <button type="button" class="toggle-password" (click)="toggleConfirmPasswordVisibility()">
              <svg *ngIf="!showConfirmPassword" viewBox="0 0 24 24" fill="none">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" stroke="currentColor" stroke-width="2"/>
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="2"/>
              </svg>
              <svg *ngIf="showConfirmPassword" viewBox="0 0 24 24" fill="none">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" stroke="currentColor" stroke-width="2"/>
                <line x1="1" y1="1" x2="23" y2="23" stroke="currentColor" stroke-width="2"/>
              </svg>
            </button>
          </div>
          <span class="error-message" *ngIf="errorMessage && errorField === 'password_confirmation'">{{ errorMessage }}</span>
        </div>

        <div class="general-error" *ngIf="errorMessage && !errorField">
          <svg viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/>
            <line x1="12" y1="8" x2="12" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <line x1="12" y1="16" x2="12.01" y2="16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span>{{ errorMessage }}</span>
        </div>

        <div class="success-message" *ngIf="successMessage">
          <svg viewBox="0 0 24 24" fill="none">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <polyline points="22 4 12 14.01 9 11.01" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>{{ successMessage }}</span>
        </div>

        <button type="submit" class="btn-submit" [disabled]="isLoading">
          <span *ngIf="!isLoading">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="none">
              <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="8.5" cy="7" r="4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <line x1="20" y1="8" x2="20" y2="14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <line x1="23" y1="11" x2="17" y2="11" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            {{ 'auth.signUp' | translate }}
          </span>
          <span *ngIf="isLoading" class="loading-spinner"></span>
        </button>
      </form>

      <div class="auth-footer">
        <p>{{ 'auth.hasAccount' | translate }}</p>
        <a routerLink="/login" class="btn-link">
          {{ 'auth.signIn' | translate }}
          <svg viewBox="0 0 24 24" fill="none">
            <line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <polyline points="12 5 19 12 12 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </div>
    </div>
  </div>
</section>
