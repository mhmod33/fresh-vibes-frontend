<section class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h1>{{ 'auth.login' | translate }}</h1>
        <p>Welcome back to Fresh Vibes</p>
      </div>

      <form (ngSubmit)="onSubmit()" class="auth-form">
        <div class="form-group">
          <label for="email">{{ 'auth.email' | translate }}</label>
          <input
            type="email"
            id="email"
            name="email"
            [(ngModel)]="loginForm.email"
            required
            placeholder="your@email.com"
          />
        </div>

        <div class="form-group">
          <label for="password">{{ 'auth.password' | translate }}</label>
          <input
            type="password"
            id="password"
            name="password"
            [(ngModel)]="loginForm.password"
            required
            placeholder="••••••••"
          />
        </div>

        <div class="form-actions">
          <a href="#" class="forgot-password">{{ 'auth.forgotPassword' | translate }}</a>
        </div>

        <button type="submit" class="btn-submit">{{ 'auth.signIn' | translate }}</button>
      </form>

      <div class="auth-footer">
        <p>{{ 'auth.noAccount' | translate }}</p>
        <a routerLink="/register" class="btn-link">{{ 'auth.signUp' | translate }}</a>
      </div>
    </div>
  </div>
</section>
